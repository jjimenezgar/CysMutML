random_seed: 42
cv_folds: 3
classification_threshold: 1.0
contact_radii_angstrom: [6.0, 8.0, 10.0]
heavy_atom_contact_radius_angstrom: 4.5
relative_sasa_reference: tien_2013
feature_sets:
  physicochemical:
    include_structural: false
  structural:
    include_structural: true
  expanded:
    include_structural: true
ranking:
  # Weights for the single transparent engineering score.
  score_weights:
    stability: 0.30
    sasa: 0.20
    flexibility: 0.20
    lysine_boost: 0.10
    existing_cys_penalty: 0.10
    secondary_structure_penalty: 0.10
  stability_reference_ddg_low: -1.0
  stability_reference_ddg_high: 2.0
lysine_environment:
  radius_angstrom: 20.0
  exposure_relative_sasa_threshold: 0.25
  saturation_k: 3.0
existing_cys:
  warning_radius_angstrom: 10.0
  strong_penalty_radius_angstrom: 6.0
  count_radii_angstrom: [6.0, 8.0, 10.0, 15.0]
  count_radius_angstrom: 10.0
monocysteine_design:
  exposed_cys_relative_sasa_threshold: 0.25
flexibility:
  method: bfactor
out_of_domain:
  numeric_margin_fraction: 0.05
