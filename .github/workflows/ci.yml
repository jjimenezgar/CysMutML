name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest -q
      - name: Build package
        if: matrix.python-version == '3.12'
        run: python -m build

  portfolio-notebook:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install notebook dependencies
        run: python -m pip install -e ".[portfolio]"
      - name: Execute portfolio notebook
        run: jupyter nbconvert --to notebook --execute notebooks/CysMutML_Portfolio_Demo.ipynb --output /tmp/CysMutML_Portfolio_Demo.executed.ipynb --ExecutePreprocessor.timeout=180
