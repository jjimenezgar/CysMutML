name: ESM context comparison
on:
  push:
    branches: [experiment/enzyme-esm-feasibility]
    paths: [.github/workflows/esm-context-comparison.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: cysmutml-audited-retraining
          run-id: 34040897260
          github-token: ${{ github.token }}
          path: frozen
      - uses: actions/download-artifact@v4
        with:
          name: enzyme-esm-feasibility
          run-id: 34327672338
          github-token: ${{ github.token }}
          path: annotation_snapshot
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y mmseqs2
          pip install torch==2.14.0 --index-url https://download.pytorch.org/whl/cpu
          pip install transformers==5.16.1 scikit-learn==1.9.0
          pip install -e .
      - name: Run paired experiment
        run: |
          python scripts/compare_esm_context.py \
            --features frozen/data/processed/fireprotdb_aggregated_features.csv \
            --annotations annotation_snapshot/uniprot_annotations.csv \
            --output experiment_output
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: esm-context-comparison
          path: |
            experiment_output/
            !experiment_output/mmseqs_tmp/
